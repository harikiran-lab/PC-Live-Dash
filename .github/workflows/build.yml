name: Build

# Builds and tests the Windows installer on every pull request and push to main.
# A GitHub Release is published when a version tag such as v2.1.0 is pushed,
# or when the workflow is run by hand on main with "release" ticked, which
# creates the tag for the version in package.json.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "package.json version: $version"

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$($env:VERSION)") {
            Write-Error "Tag $($env:TAG) does not match package.json version $($env:VERSION). Use 'npm version' to create tags."
            exit 1
          }

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check PowerShell scripts for syntax errors
        # Windows PowerShell 5.1 is what the tray app and server use.
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in 'tray.ps1', 'gpu.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$file line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "$file parses cleanly"
            }
          }
          if ($failed) { exit 1 }

      - name: Build server .exe
        run: npm run build:exe

      - name: Build launcher .exe
        shell: powershell
        run: scripts\build-launcher.ps1

      - name: Smoke test the server .exe
        shell: pwsh
        run: |
          $server = Start-Process -FilePath dist\pc-live-dash-server.exe -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput server.log -RedirectStandardError server.err.log
          node scripts/smoke-test.js 3000
          $result = $LASTEXITCODE
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- server output ---"
          Get-Content server.log, server.err.log -ErrorAction SilentlyContinue
          Remove-Item dist\config.json -ErrorAction SilentlyContinue
          exit $result

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$($env:VERSION)" installer\pc-live-dash.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the installer (install, run, quit, uninstall)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          try {
            scripts\test-installer.ps1 -Setup "release\PC-Live-Dash-Setup-v$($env:VERSION).exe"
          } finally {
            if (Test-Path install.log) {
              Write-Host "--- installer log (tail) ---"
              Get-Content install.log -Tail 40
            }
          }

      - name: Assemble release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Portable copy: the same files the installer puts in place.
          $name = "PC-Live-Dash-v$($env:VERSION)-win-x64-portable"
          New-Item -ItemType Directory -Path "release\$name" | Out-Null
          Copy-Item "dist\PC Live Dash.exe", dist\pc-live-dash-server.exe, tray.ps1, README.md -Destination "release\$name"
          Compress-Archive -Path "release\$name" -DestinationPath "release\$name.zip"
          Remove-Item "release\$name" -Recurse
          Get-FileHash (Get-ChildItem release\*.exe, release\*.zip) -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "release\SHA256SUMS.txt"
          Get-ChildItem release -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Live-Dash-v${{ steps.version.outputs.version }}-win-x64
          path: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
        description: Publish a GitHub Release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "package.json version: $version"

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$($env:VERSION)") {
            Write-Error "Tag $($env:TAG) does not match package.json version $($env:VERSION). Use 'npm version' to create tags."
            exit 1
          }

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check PowerShell scripts for syntax errors
        # Windows PowerShell 5.1 is what the tray app and server use.
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in 'tray.ps1', 'gpu.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$file line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "$file parses cleanly"
            }
          }
          if ($failed) { exit 1 }

      - name: Build .exe
        run: npm run build:exe

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $server = Start-Process -FilePath dist\PC-Live-Dash.exe -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput server.log -RedirectStandardError server.err.log
          node scripts/smoke-test.js 3000
          $result = $LASTEXITCODE
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- server output ---"
          Get-Content server.log, server.err.log -ErrorAction SilentlyContinue
          exit $result

      - name: Assemble release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "PC-Live-Dash-v$($env:VERSION)-win-x64"
          New-Item -ItemType Directory -Path "release\$name" | Out-Null
          Copy-Item dist\PC-Live-Dash.exe, tray.ps1, tray.cmd, README.md -Destination "release\$name"
          Compress-Archive -Path "release\$name" -DestinationPath "release\$name.zip"
          Copy-Item dist\PC-Live-Dash.exe "release\$name.exe"
          Get-FileHash "release\$name.zip", "release\$name.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "release\SHA256SUMS.txt"
          Get-ChildItem release -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Live-Dash-v${{ steps.version.outputs.version }}-win-x64
          path: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PC-Live-Dash-v${{ needs.build.outputs.version }}-win-x64
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # The tag already exists and was checked against package.json.
            gh release create "$TAG" release/* \
              --title "PC Live Dash $TAG" --generate-notes --verify-tag
          else
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Releases are published from main, not $REF."
              exit 1
            fi
            # Creates the tag on the commit that was built.
            gh release create "$TAG" release/* \
              --title "PC Live Dash $TAG" --generate-notes --target "$GITHUB_SHA"
          fi
